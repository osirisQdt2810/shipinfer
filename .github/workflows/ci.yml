# CI on main: the offline suite across every supported interpreter, plus coverage.
#
# Why this exists separately from pr-pipeline.yml: that workflow triggers only on
# `pull_request`, so it never runs on main — and a status badge asking for `?branch=main`
# finds no run and renders "no status".
#
# The suite itself lives in scripts/run_tests.sh so the two cannot drift.
#
# Only the OFFLINE tier runs here. The GPU tier needs real devices a GitHub runner does not
# have; it is a human's pre-release step, evidenced in the PR body (ADR-001 is what makes
# the offline tier meaningful without one).

name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # requires-python = ">=3.10". Every supported interpreter gets a leg: 3.11 as an
        # untested middle is exactly where a typing or dataclass behaviour change hides,
        # and a missing leg does not fail loudly — it fails on someone's node.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # Deliberately NO submodules: the offline tier must pass without the fused kernels.
      # That is the promise of `execution.provider: auto`, and not fetching them here is
      # how it stays true.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install torch (CPU build)
        # The CPU wheel deliberately: it is ~200 MB instead of ~2.5 GB, and the offline tier
        # must pass with no accelerator anyway. If a change makes CI need a CUDA wheel, that
        # change has broken ADR-001.
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install the package and its dev tooling
        run: pip install -e ".[dev,cli]"
      - name: Run the offline test suite
        run: bash scripts/run_tests.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -e ".[dev,cli]"
      - name: ruff / black / isort
        run: |
          ruff check src tests scripts
          black --check src tests scripts
          isort --check-only src tests scripts
      - name: Layer boundaries (ADR-001)
        # The single most damaging mistake available here: the day `core` imports torch, the
        # offline suite silently starts needing a GPU and nobody notices for a month.
        run: python scripts/hooks/check_layers.py
      - name: Model repository configs parse
        run: python scripts/hooks/check_model_configs.py model_repository/*/config.yaml

  cpp-offline:
    name: C++ offline tier (no driver)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the CUDA-free test binaries with g++ alone
        # `--offline` builds only the apps whose include closure never reaches `core/platform.h`:
        # no nvcc, no CUDA, no TensorRT. These are the scheduler's fairness invariants, the
        # instance/model seam and the containment gate — the C++ plane's counterpart of the
        # Python offline tier, and the tests most worth running on a machine with no driver.
        run: python scripts/build_csrc.py --offline
      - name: Run them
        run: |
          set -e
          for binary in csrc/build/test_scheduling csrc/build/test_server csrc/build/test_containment csrc/build/test_ingest; do
            echo "== $binary"
            "$binary"
          done

  kernels:
    name: Fused kernels (compile only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Only the kernels, by name. `submodules: recursive` also pulls
          # `benchmarks/baseline` — `ShipControlPrj/counting-simulation`, a third-org SSH
          # remote this runner cannot read — and `git submodule update --init --recursive`
          # aborts the whole checkout when one submodule fails. Same failure that made the
          # review job report a verdict it never computed.
          submodules: false
      - name: Check out the kernels only
        # Without this the submodule directory is an empty placeholder and the job below
        # silently passes having built nothing.
        #
        # The rewrite exists because .gitmodules records the SSH remote (the house rule for
        # humans) and a plain runner has no deploy key — shipvision is public, so anonymous
        # https is the right transport here. This job had never once passed: it was born in
        # #28 failing on exactly this, and two red mains surfaced it (27 Aug).
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 3rdparty/shipvision
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: "12.6.0"
          method: network
          sub-packages: '["nvcc", "cudart"]'
      - run: pip install pybind11 numpy
      - name: Build the submodule's kernels
        # A runner has nvcc but no device, so this proves the kernels COMPILE against the
        # pinned commit — it cannot prove they are correct. Correctness is the parity tests
        # in shipvision's own GPU tier, which run on real hardware before a release.
        # What this job is really for is catching a submodule bump that does not build.
        run: python 3rdparty/shipvision/build.py --arch 86

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -e ".[dev,cli]"
      - name: Measure coverage
        # Its own job rather than a flag on the matrix: the version legs exist to catch
        # interpreter-specific breakage and should stay fast, and coverage only needs
        # measuring once. Deliberately NOT a merge gate.
        run: >-
          bash scripts/run_tests.sh
          --cov=src/shipinfer --cov-report=term:skip-covered --cov-report=xml
