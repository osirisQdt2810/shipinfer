# CI on main: the offline suite across every supported interpreter, plus coverage.
#
# Why this exists separately from pr-pipeline.yml: that workflow triggers only on
# `pull_request`, so it never runs on main — and a status badge asking for `?branch=main`
# finds no run and renders "no status".
#
# The suite itself lives in scripts/run_tests.sh so the two cannot drift.
#
# Only the OFFLINE tier runs here. The GPU tier needs real devices a GitHub runner does not
# have; it is a human's pre-release step, evidenced in the PR body (ADR-001 is what makes
# the offline tier meaningful without one).

name: CI

on:
  push:
    branches: [main]
  # A push made with GITHUB_TOKEN creates no workflow run, so a PR merged by the pipeline's
  # Auto-merge job never triggered this workflow: #52, #53 and #57 landed with no main run at
  # all, while manually merged PRs got one. workflow_dispatch is the documented exception, so
  # the Auto-merge job dispatches this workflow after it merges (pr-pipeline.yml).
  workflow_dispatch:

concurrency:
  group: ci-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # requires-python = ">=3.10". Every supported interpreter gets a leg: 3.11 as an
        # untested middle is exactly where a typing or dataclass behaviour change hides,
        # and a missing leg does not fail loudly — it fails on someone's node.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # Deliberately NO submodules: the offline tier must pass without the fused kernels.
      # That is the promise of `execution.provider: auto`, and not fetching them here is
      # how it stays true.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install torch (CPU build)
        # The CPU wheel deliberately: it is ~200 MB instead of ~2.5 GB, and the offline tier
        # must pass with no accelerator anyway. If a change makes CI need a CUDA wheel, that
        # change has broken ADR-001.
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install the package and its dev tooling
        run: pip install -e ".[dev,cli]"
      - name: Run the offline test suite
        run: bash scripts/run_tests.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -e ".[dev,cli]"
      - name: ruff / black / isort
        run: |
          ruff check src tests scripts
          black --check src tests scripts
          isort --check-only src tests scripts
      - name: Layer boundaries (ADR-001)
        # The single most damaging mistake available here: the day `core` imports torch, the
        # offline suite silently starts needing a GPU and nobody notices for a month.
        run: python scripts/hooks/check_layers.py
      - name: Model repository configs parse
        run: python scripts/hooks/check_model_configs.py model_repository/*/config.yaml

  cpp-offline:
    name: C++ offline tier (no driver)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the CUDA-free test binaries with g++ alone
        # `--offline` builds only the apps whose include closure never reaches `core/platform.h`:
        # no nvcc, no CUDA, no TensorRT. These are the scheduler's fairness invariants, the
        # instance/model seam and the containment gate — the C++ plane's counterpart of the
        # Python offline tier, and the tests most worth running on a machine with no driver.
        run: python scripts/build_csrc.py --offline
      - name: Run them
        run: |
          set -e
          # Run every offline binary the build produced rather than a fixed name list: the
          # csrc/ tree mirrors the Python packages (arch.md §9), so a package rename renames
          # its test binary too, and a hard-coded name would fail main the moment it lands.
          # The count guard keeps a build that produced nothing from passing silently.
          # Executables only: the build leaves test_<name>.o beside each binary.
          binaries=()
          for candidate in csrc/build/test_*; do
            [[ -x "$candidate" && "$candidate" != *.o ]] && binaries+=("$candidate")
          done
          test "${#binaries[@]}" -ge 4 || { echo "expected at least 4 offline binaries, found ${#binaries[@]}"; exit 1; }
          for binary in "${binaries[@]}"; do
            echo "== $binary"
            "$binary"
          done

  cpp-syntax:
    name: C++ units nothing else compiles (headers only, no driver)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pytest is NOT in this interpreter by default -- it comes from the `dev` extra, which
      # only the `test` job installs. Without this the step ran `No module named pytest` and,
      # behind a `| tee`, reported success: the job could never fail for the reason it exists.
      - name: Install pytest
        run: pip install pytest
      # `cli/bench.cpp` reaches `core/platform.h`, so `--offline` refuses it and NOTHING here
      # compiled it -- the hole that let a `std::mutex` be used in its sink without being
      # declared, found by a reviewer rather than by a build. Eight implementation units are
      # in the same position, including `backends/tensorrt/engine.cpp`. `-fsyntax-only` needs
      # the two HEADER sets and no driver, no nvcc and no GPU, which is why this is an
      # ordinary runner rather than the device tier.
      - name: Install the CUDA and TensorRT headers
        run: |
          set -euxo pipefail
          codename=$(. /etc/os-release && echo "${VERSION_ID//./}")
          wget -q "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu${codename}/x86_64/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          # Headers only: `cuda-cudart-dev` brings `cuda_runtime.h` and the pinned
          # `libnvinfer-headers-dev` brings `NvInfer.h`. No runtime, no nvcc, ~40 MB.
          # PINNED to TensorRT 10: this tree has no `NV_TENSORRT_MAJOR` guard, so an
          # unpinned major would break main's CI with no commit to blame.
          sudo apt-get install -y --no-install-recommends \
            cuda-cudart-dev-12-6 "libnvinfer-headers-dev=10.*"
      - name: Syntax-check every unit the offline build cannot reach
        shell: bash          # -> `bash --noprofile --norc -eo pipefail`, so a pipe cannot mask
        env:
          # `cuda-cudart-dev-12-6` installs under a versioned prefix, and the test's probe
          # reads CUDA_HOME exactly as `scripts/build_csrc.py` does.
          CUDA_HOME: /usr/local/cuda-12.6
          # A SKIP is the hole this job exists to close, so here it is a FAILURE with a
          # reason -- asserted by a test rather than by grepping pytest's `-q` summary, whose
          # shape changes between versions and whose exit status a pipe used to swallow.
          SHIPINFER_REQUIRE_CSRC_HEADERS: "1"
        run: python -m pytest tests/test_cuda_reaching_apps_compile.py -q -rs -p no:cacheprovider

  cpp-gst-lane:
    name: C++ gst lane (section O + the pixel)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      # NO setup-python here, deliberately (the job's first main run failed on this): the
      # loopback resolves `python3` on PATH to spawn scripts/rtsp_serve.py, and
      # setup-python's hermetic interpreter shadows the system one — which is the only
      # python that can see apt's python3-gi/gir typelibs. ModuleNotFoundError: 'gi', the
      # pixel skips, and the grep gate goes red exactly as designed. The system python3 on
      # ubuntu-latest runs build_csrc.py fine.
      - name: Install the gstreamer lane's packages
        # The dev pair is what `--with-external gstreamer` pkg-configs; the rest is what
        # section P's loopback needs at runtime: the RTSP server (PyGObject + its typelib),
        # software decode for the h264 stream, and ffmpeg for the JPEG fixtures. Mirrors
        # deploy/rootless/gst-image.sh minus the DeepStream-adjacent extras.
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq             libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev             gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad             gstreamer1.0-libav gstreamer1.0-rtsp             python3-gi gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0             gir1.2-gst-rtsp-server-1.0 ffmpeg
      - name: Build the gst lane (still g++ alone — no CUDA, no TensorRT)
        run: python scripts/build_csrc.py --offline --with-external gstreamer
      - name: Run it, and require the pixel
        # `grep PIXEL` is load-bearing: a run where section P silently skipped would still
        # print a green count, and a green count that looked at no pixel is the failure
        # mode #48 added the PIXEL line to prevent. stdout carries the line; the count and
        # any SKIPs stay visible in the log either way.
        run: |
          set -o pipefail
          ./csrc/build/test_ingest 2>&1 | tee /tmp/gst-lane.log
          grep -q "PIXEL:" /tmp/gst-lane.log

  kernels:
    name: Fused kernels (compile only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Only the kernels, by name. `submodules: recursive` also pulls
          # `benchmarks/baseline` — `ShipControlPrj/counting-simulation`, a third-org SSH
          # remote this runner cannot read — and `git submodule update --init --recursive`
          # aborts the whole checkout when one submodule fails. Same failure that made the
          # review job report a verdict it never computed.
          submodules: false
      - name: Check out the kernels only
        # Without this the submodule directory is an empty placeholder and the job below
        # silently passes having built nothing.
        #
        # The rewrite exists because .gitmodules records the SSH remote (the house rule for
        # humans) and a plain runner has no deploy key — shipvision is public, so anonymous
        # https is the right transport here. This job had never once passed: it was born in
        # #28 failing on exactly this, and two red mains surfaced it (27 Aug).
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 3rdparty/shipvision
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: "12.6.0"
          method: network
          sub-packages: '["nvcc", "cudart"]'
      - run: pip install pybind11 numpy
      - name: Build the submodule's kernels
        # A runner has nvcc but no device, so this proves the kernels COMPILE against the
        # pinned commit — it cannot prove they are correct. Correctness is the parity tests
        # in shipvision's own GPU tier, which run on real hardware before a release.
        # What this job is really for is catching a submodule bump that does not build.
        # The entrypoint the submodule actually has (its README's own line): the old
        # `build.py --arch 86` predates shipvision's restructure and never existed in any
        # revision this repository has pinned — the job could not reach it until #36 fixed
        # the clone, so today's red main was its first honest compile attempt.
        run: |
          python -m pip install --quiet pybind11
          cmake -S 3rdparty/shipvision -B 3rdparty/shipvision/build \
            -DCMAKE_CUDA_ARCHITECTURES=86
          cmake --build 3rdparty/shipvision/build -j

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -e ".[dev,cli]"
      - name: Measure coverage
        # Its own job rather than a flag on the matrix: the version legs exist to catch
        # interpreter-specific breakage and should stay fast, and coverage only needs
        # measuring once. Deliberately NOT a merge gate.
        run: >-
          bash scripts/run_tests.sh
          --cov=src/shipinfer --cov-report=term:skip-covered --cov-report=xml
