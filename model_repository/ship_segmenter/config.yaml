# Stage 2, ships only: instance masks for the crops the detector classified as vessels.
#
# Conditional by design — it never sees a person crop, which is what makes the DAG's
# class-conditional branch worth having rather than a uniform pipeline.
#
# A REAL engine: yolo26n-seg from the ultralytics weights, the same model
# `benchmarks/baseline` segments with.
name: ship_segmenter
platform: tensorrt
max_batch_size: 8

inputs:
  - name: images
    data_type: FP32
    dims: [3, 640, 640]

outputs:
  # 300 slots of [x1, y1, x2, y2, score, class] followed by 32 mask coefficients, plus the
  # prototype tensor those coefficients combine. The mask is reconstructed downstream, and
  # reduced to an area at that stage — holding 15 x 512^2 floats per frame through reassembly
  # is 15 MB a frame and the pipeline would spend its memory on pixels nobody reads.
  - name: output0
    data_type: FP32
    dims: [300, 38]
  - name: output1
    data_type: FP32
    dims: [32, 160, 160]

instance_groups:
  # Two per GPU, and the number is a measurement, not a guess. The old comment argued "one,
  # not two: segmentation runs on a fraction of the frames, so a second instance would hold
  # memory for work that is not arriving" — and the fleet ceiling sweep (27 Aug 2026,
  # 12 cameras x 2 fps x rung 6 on GPUs 3-5) proved the work does arrive: at 48 img/s per
  # GPU the single instance's queue capped (3-25 rejected requests per shard) and bounded
  # the whole fleet at 96 img/s, while count: 2 sustained 143.8 img/s with every stage
  # flat. The design load is 62.5 img/s per GPU, so one instance would cap the deployment
  # this repository is sized for. MEASURED AT ONE SHARD PER GPU: `expand()` divides this
  # count among processes sharing a device, so a fleet running two shards on one GPU gets
  # one instance each and lands back on exactly the ceiling this number removes — and does
  # so silently, because raising the count also removed the loud "the process ranked 1
  # would get none" refusal that count: 1 tripped. Scale the count with the shard count.
  - kind: KIND_AUTO
    count: 2
    streams: 2

dynamic_batching:
  enabled: true
  max_queue_delay_us: 8000
  preferred_batch_sizes: [4, 8]

parameters:
  engine_file: model.plan
