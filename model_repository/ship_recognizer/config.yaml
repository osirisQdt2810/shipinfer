# Stage 4: match a ship embedding against the enrolled gallery -> a ship id.
#
# Deterministic and stateless, and the same ship sits in frame for minutes at a time, so
# this is the one model in the repository where the response cache genuinely pays: a parked
# ship's identical embedding is answered from memory instead of a GPU.
name: ship_recognizer
platform: mock
max_batch_size: 32

inputs:
  - name: embedding
    data_type: FP32
    dims: [512]

outputs:
  - name: ship_id
    data_type: INT64
    dims: [1]
  - name: similarity
    data_type: FP32
    dims: [1]

instance_groups:
  - kind: KIND_AUTO
    count: 1
    streams: 1

dynamic_batching:
  enabled: true
  max_queue_delay_us: 8000
  preferred_batch_sizes: [8, 16, 32]

parameters:
  engine_file: model.plan
  latency_ms: 0.8
  per_item_latency_ms: 0.02
  response_cache:
    type: lru
    max_entries: 8192
    max_bytes: 67108864
