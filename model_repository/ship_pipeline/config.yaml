# The whole perception DAG as one addressable model.
#
#   frame -> detect -> crop ─┬─ ship   -> segment -> embed -> recognize
#                            └─ person -> embed
#
# Declaring it here rather than orchestrating it in a client means the *server* owns the
# data flow, so intermediate tensors never round-trip to the caller — the same reason
# Triton has ensembles.
#
# `condition` is this project's addition to the Triton ensemble vocabulary: it is how
# "segment only where a ship was detected" is expressed declaratively instead of in a
# hand-written orchestration loop that every caller would have to reimplement.
name: ship_pipeline
platform: ensemble
max_batch_size: 32

inputs:
  - name: images
    data_type: FP32
    dims: [3, 640, 640]

outputs:
  - name: boxes
    data_type: FP32
    dims: [100, 6]
  - name: ship_id
    data_type: INT64
    dims: [1]
  - name: person_embedding
    data_type: FP32
    dims: [512]

dynamic_batching:
  enabled: false        # each step batches on its own terms; batching twice adds latency

ensemble:
  steps:
    - model: ship_detector
      input_map: {images: images}
      output_map: {boxes: boxes, num_detections: num_detections}

    # Cropping is GPU work, so it is a model instance the scheduler can place and batch,
    # not a callback on the orchestration thread. It also emits the branch conditions.
    - model: crop_router
      input_map: {images: images, boxes: boxes}
      output_map:
        ship_seg_crops: ship_seg_crops
        ship_reid_crops: ship_reid_crops
        person_crops: person_crops
        has_ship: has_ship
        has_person: has_person

    - model: ship_segmenter
      input_map: {crops: ship_seg_crops}
      output_map: {masks: ship_masks}
      condition: has_ship

    - model: ship_embedder
      input_map: {crops: ship_reid_crops}
      output_map: {embedding: ship_embedding}
      condition: has_ship

    - model: ship_recognizer
      input_map: {embedding: ship_embedding}
      output_map: {ship_id: ship_id, similarity: ship_similarity}
      condition: has_ship

    - model: person_embedder
      input_map: {crops: person_crops}
      output_map: {embedding: person_embedding}
      condition: has_person
