# Stage 1 of the perception DAG: one detector over every frame, classes {ship, person}.
#
# Runs on EVERY frame from every camera, so at 50 cameras x 20 fps it sees 1000 req/s — the
# highest-volume model in the repository and the one whose instance count matters most.
#
# This is a REAL engine, not a stand-in. `1/model.plan` is yolo26n built from the ultralytics
# weights by `scripts/build_engines.py`, which is the same model
# `benchmarks/baseline` (counting-simulation) runs — so a comparison between the two systems
# is about the serving architecture and not about the network.
#
# An engine is only valid for the GPU architecture and TensorRT version that built it, so the
# plan is gitignored and built per machine. `shipinfer doctor` says whether one is present.
name: ship_detector
platform: tensorrt

# The engine is built with a static batch of 8, and the backend fails at load if this
# disagrees with the plan rather than silently truncating a batch.
max_batch_size: 8

inputs:
  - name: images                 # NCHW, RGB, letterboxed, normalised to [0, 1]
    data_type: FP32
    dims: [3, 640, 640]          # batch dim is owned by max_batch_size, as in Triton

outputs:
  # yolo26 is end-to-end: the engine emits decoded boxes with NMS already applied, so there
  # are 300 slots of [x1, y1, x2, y2, score, class] and no anchor decode downstream.
  - name: output0
    data_type: FP32
    dims: [300, 6]

instance_groups:
  # Empty `gpus` means "every visible device", so this file is unchanged between a 4-GPU dev
  # box and a 16-GPU node. Two instances per GPU because the detector is the hot path; two
  # streams each so the host-to-device copy of the next batch overlaps the current compute.
  #
  # TWO IS MEASURED, on the batch rather than on throughput: three per GPU splits one request
  # stream across more queues, so the ACHIEVED batch falls 2.82 -> 2.04 (separated, n=8) while
  # occupancy climbs to 210%, which is queueing. Tracked img/s is 7% lower on the mean and the
  # ranges OVERLAP at n=8 -- this box cannot resolve an effect that size. Re-test before moving.
  - kind: KIND_AUTO
    count: 2
    streams: 2

dynamic_batching:
  enabled: true
  # 5 ms is well inside a 50 ms frame budget at 20 fps. Whether it fills a batch of 8 depends
  # on the ARRIVAL rate, not on the window: `per_device_batches` reads ~2.8 in the full chain
  # at 2 000 img/s offered and ~7.0 on `detect_only` at 4 000, at this same 5 ms.
  #
  # A FULLER BATCH BUYS NOTHING WHERE THE BATCH IS ALREADY FULL: 20 ms reaches 7.62 of 8 on
  # detect-only at 4 000 offered, leaving under 5% of fill, so batching cannot be a large lever
  # THERE. At this file's own deployment load -- 50x20, the header's 1000 req/s -- the fill is
  # 2.74 and the only throughput reading is +3.4% overlapping at n=3, which is undetermined.
  max_queue_delay_us: 5000
  preferred_batch_sizes: [4, 8]

parameters:
  engine_file: model.plan
