# Stage 3, people: one appearance vector per person crop, for the tracker to match on.
#
# A REAL engine: ResNet-50 with ImageNet weights, global-pooled and L2-normalised to a 2048-d
# vector — the same backbone family the reference FastReID implementation uses (R50-SBS).
# NOT built by `scripts/build_engines.py`: that script's `reid` target writes
# `models/reid_r50_fp32.engine` and installs it into no version directory, so this one
# is placed by hand -- see `1/README.md`. (#143)
#
# What is claimed and what is not: the whole path is exercised — crop, letterbox, batch,
# engine, normalise, gallery — with a network of the right shape and the right cost. It is
# not a re-identification-trained checkpoint, so embedding *accuracy* is not claimed here.
# Accuracy is measured separately, on MOT17 with ground truth, by `shipvision/eval`. Saying
# which of the two a number supports is the difference between evidence and decoration.
name: person_embedder
platform: tensorrt
max_batch_size: 16

inputs:
  - name: images
    data_type: FP32
    dims: [3, 256, 128]          # tall, not square: a person crop wastes half a square

outputs:
  - name: embedding
    data_type: FP32
    dims: [2048]

instance_groups:
  - kind: KIND_AUTO
    count: 2
    streams: 2

dynamic_batching:
  enabled: true
  # The highest-volume model in the repository: ~15 crops per frame at 1000 fps is 15 000 req/s, so a short window and a full batch matter more here than anywhere else.
  max_queue_delay_us: 3000
  preferred_batch_sizes: [8, 16]

parameters:
  engine_file: model.plan
