# ShipInfer — a customizable, Triton-shaped multi-GPU inference server for the ship /
# person perception pipeline (detect -> segment -> embed -> recognize -> track).
#
# It is a LIBRARY + a SERVER, not a desktop app and not a notebook. Install for
# development with:  pip install -e ".[dev]"
#
# Hard rules encoded below:
#   * the pure core (`shipinfer.core`, `shipinfer.scheduling`, `shipinfer.repository`)
#     imports NOTHING heavier than numpy/pydantic, so the offline suite runs on a laptop
#     with no GPU, no TensorRT and no network;
#   * every GPU/runtime dependency is an OPTIONAL extra behind a backend seam;
#   * a plain `pytest` must never need a GPU (`-m "not gpu"`).

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shipinfer"
version = "0.1.0"
description = "Triton-shaped, hackable multi-GPU inference server for ship/person perception"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "phucnp", email = "phuc.nguyen@moreh.com.vn" }]
keywords = [
    "inference-server", "triton", "tensorrt", "cuda", "multi-gpu",
    "dynamic-batching", "object-detection", "reid", "multi-object-tracking",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The base install is deliberately tiny: the scheduler, the model repository and the
# request/response types are pure Python. Everything that touches a GPU is an extra.
dependencies = [
    # torch is a HARD dependency, not an extra. It is the runtime substrate: the caching
    # device allocator, the caching pinned-host allocator, streams, events and CUDA graph
    # capture all come from it, and on ROCm the same API covers HIP. Re-implementing any of
    # that against raw driver bindings would be slower and platform-specific (ADR-003).
    # The CPU wheel is enough to install, import and run the whole offline test suite.
    "torch>=2.2",
    "numpy>=1.24,<3",           # the tensor interchange format across every seam
    "pydantic>=2.7,<3",         # model config + settings validation
    "pydantic-settings>=2.2,<3",# env/file layering for ServerSettings
    "PyYAML>=6.0",              # model repository config files (config.yaml)
    "typing-extensions>=4.9",   # Self / override / assert_never on Python 3.10
]

[project.optional-dependencies]
# --- runtime backends (pick what the deployment actually needs) -------------------
cuda = ["cuda-python>=12.0"]                       # raw driver access, `custom` variants only
# The fused kernels. Not on PyPI: it is vendored as a submodule, so install it from there
#   git submodule update --init 3rdparty/shipvision
#   pip install -e 3rdparty/shipvision
# Listing it here as a hard dependency would make `pip install shipinfer` fail everywhere.
imgproc = ["shipvision"]
tensorrt = ["tensorrt>=8.6", "cuda-python>=12.0"]  # the production backend
vision = ["torchvision>=0.17"]                     # tuned NMS / roi ops
onnx = ["onnxruntime-gpu>=1.17"]                   # portable fallback backend

# --- edges of the system ----------------------------------------------------------
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]   # KServe v2 HTTP facade
video = ["opencv-python-headless>=4.9", "av>=12.0"]      # RTSP/file ingest + decode
kafka = ["confluent-kafka>=2.3"]                         # result publishing (Plane 3 feed)
cli = ["typer>=0.12", "rich>=13.7"]                      # `shipinfer ...`
# The shard control plane (arch.md §2). Optional because the in-process runner needs no
# RPC at all, and the launcher must stay importable on a host that installed neither —
# `launch/client.py` refuses with a typed ConfigurationError naming this extra.
# Both floors are set by the COMMITTED stubs in `launch/proto/`, not by the wire format,
# and both are checked at import by the generated code itself:
#   * protobuf >=5.29 - `shard_pb2.py` declares a 5.29 gencode version and calls
#     `ValidateProtobufRuntimeVersion` on it;
#   * grpcio >=1.71.2 - `shard_pb2_grpc.py` carries GRPC_GENERATED_VERSION = '1.71.2' and
#     raises at import below it. Declaring a lower floor here would let a *supported* install
#     resolve grpcio 1.60 and then die on a raw traceback out of protoc's output.
# `tests/launch/test_generated_floor.py` reads both numbers out of the stubs and fails if
# these declarations drift below them. Regenerate with a matching grpcio-tools if either
# floor ever has to move.
grpc = ["grpcio>=1.71.2,<2", "protobuf>=5.29,<6"]        # shard control plane (arch.md §2)

# Everything a developer needs, and nothing that needs a GPU to install.
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",       # a deadlocked scheduler test must fail, not hang CI
    "hypothesis>=6.100",         # property tests for the batcher/queue invariants
    "black>=24.4",
    "ruff>=0.4",
    "isort>=5.13",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",               # TestClient transport for the HTTP facade
    # `tests/launch/test_generated_floor.py` reads this file back to check the dependency
    # floors against the committed stubs. `tomllib` is stdlib from 3.11; on the 3.10 CI leg
    # the test would otherwise be skipped on the one axis most likely to resolve an old
    # grpcio.
    'tomli>=2.0; python_version < "3.11"',
    # The control-plane tests, and the guard that says the committed stubs match the
    # .proto. In `dev` and not only in `grpc` on purpose: CI installs `.[dev,cli]`, so
    # without these every proto test would skip there and the regeneration guard would
    # never run on the one machine that gates a merge.
    # Same floors as the `grpc` extra, and for the same reason: the committed stubs
    # validate GRPC_GENERATED_VERSION = '1.71.2' and a 5.29 gencode version at import, so
    # anything lower fails loudly rather than being merely old.
    "grpcio>=1.71.2,<2",
    # grpcio-tools is PINNED, and it is the only pin in this file. `scripts/gen_proto.py
    # --check` regenerates the stubs and compares them BYTE FOR BYTE against the committed
    # ones, so the guard is only meaningful while every machine runs the same protoc: 1.83
    # emits a different `shard_pb2_grpc.py` for the same .proto and would fail the check on
    # a green tree. Today the pin is also what already happens by accident - `protobuf<6`
    # drags grpcio-tools back to 1.71.2 - and an accident is not a guarantee: the day that
    # floor moves, this line is what keeps the check honest instead of quietly red.
    # Bump it deliberately, regenerate, and commit the new stubs in the same commit.
    "grpcio-tools==1.71.2",
    "protobuf>=5.29,<6",
]

[project.scripts]
shipinfer = "shipinfer.cli:main"

[project.urls]
Homepage = "https://github.com/osirisQdt2810/shipinfer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The .proto ships with the wheel although nothing at runtime reads it: it is the
# contract, and an operator writing a client in another language should not have to
# clone the repository to get it.
shipinfer = ["py.typed", "resources/**/*", "launch/proto/*.proto"]

# ---------------------------------------------------------------------------
# Formatting / linting / typing
# ---------------------------------------------------------------------------
[tool.black]
line-length = 96
target-version = ["py310"]
extend-exclude = '''
/(
    \.venv
  | build
  | dist
  | references
  | 3rdparty
  | benchmarks/baseline
)/
'''
# `force-exclude`, not `extend-exclude`: pre-commit passes staged files to black by name, and
# `extend-exclude` does not apply to a file named on the command line. The generated protobuf
# stubs are protoc's output verbatim — reformatting them makes every regeneration a diff and
# `scripts/gen_proto.py --check` a false alarm.
force-exclude = '''
/(
    src/shipinfer/launch/proto/.*_pb2.*\.pyi?
)
'''

[tool.ruff]
line-length = 96
target-version = "py310"
# `benchmarks/baseline` is the counting-simulation submodule — the system we are measured
# against. Linting or reformatting it would rewrite the baseline, and a baseline we edited
# is not a baseline.
# The generated protobuf stubs are excluded for the same reason as the baseline: they are
# a compiler's output, put back by `python scripts/gen_proto.py`, and a lint fix applied
# to one would be silently reverted by the next regeneration.
extend-exclude = [
    ".venv", "build", "dist", "references", "3rdparty", "benchmarks/baseline",
    "src/shipinfer/launch/proto/*_pb2*",
]
force-exclude = true

[tool.ruff.lint]
# Import sorting (I) is delegated to standalone isort, not ruff, so pre-commit has one
# owner per concern. PERF/C4 matter here: this is a hot path, a list comprehension in the
# dispatch loop is not a style preference.
select = [
    "E", "F", "W",      # pycodestyle + pyflakes
    "N",                # pep8-naming
    "UP",               # pyupgrade
    "B",                # bugbear
    "SIM",              # simplify
    "RUF",
    "TID",              # banned imports (the layering rule)
    "C4",               # comprehensions
    "PERF",             # obvious inefficiencies in loops
    "PTH",              # pathlib over os.path
    "DTZ",              # timezone-aware datetimes only
    "RET", "ARG", "ANN",
]
ignore = [
    "E501",    # line length is black's job
    "ANN401",  # `Any` is legitimate at the backend seam (opaque engine handles)
    "UP007",   # tolerate Optional[X] beside X | None
    "UP045",
    "B008",    # typer/fastapi dependency defaults are calls by design
    "RET504",  # a named result before `return` is often the clearer read
    "PERF203", # try/except in a loop is how a worker survives one bad request
    # An implementation of an ABC must accept the whole signature whether or not it uses
    # every parameter — a null provider that ignores `nbytes` is correct, not sloppy.
    "ARG002",
    # An empty method on an ABC is an intentional optional hook (`close`, `_do_finalize`).
    # Marking it abstract would force every subclass to write `pass`.
    "B027",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The layering rule, enforced where it is cheapest to enforce. `shipinfer.core` and
# `shipinfer.scheduling` must stay importable with numpy alone (ADR-001).
"pycuda".msg = "use shipinfer.runtime.cuda — one CUDA facade, not three (ADR-003)"
"tensorflow".msg = "not a dependency of this project"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]                       # re-exports and registry side-effects
"tests/**" = ["ANN", "ARG", "N802", "N803", "N806", "RUF012", "DTZ", "PERF"]
"benchmarks/**" = ["ANN", "T201", "PERF"]
"scripts/**" = ["ANN", "T201"]
# gRPC handler names are protobuf's, and protobuf's are CamelCase. `add_ShardServicer_
# to_server` binds them by exact attribute name, so renaming them to snake_case would
# unbind the service. One file, one rule, rather than eight noqa comments.
"src/shipinfer/runners/service.py" = ["N802"]

[tool.isort]
profile = "black"
line_length = 96
src_paths = ["src", "tests", "scripts", "benchmarks"]
skip_glob = [
    ".venv/*", "build/*", "dist/*", "references/*", "3rdparty/*", "benchmarks/baseline/*",
]
# protoc's output is not ours to sort: `shard_pb2_grpc.py` puts `import grpc` above
# `import warnings`, and isort moving it makes `python scripts/gen_proto.py --check` fail
# against a checkout it just "fixed". `extend_skip_glob` rather than another `skip_glob`
# entry so this survives someone rewriting the list above, and it is repeated as an
# `exclude:` on the isort hook in `.pre-commit-config.yaml`, so that neither the hook nor a
# bare `isort <file>` depends on the other being right.
extend_skip_glob = ["*/launch/proto/*_pb2*"]
# The skip applies to files named on the command line, not only to ones isort found by
# walking a directory. Without it, `isort --check-only src/.../shard_pb2_grpc.py` reorders
# protoc's output - and pre-commit passes filenames explicitly, so that is the case that
# matters. Measured on isort 8.0.1: the skip above is a no-op for a named file without this.
filter_files = true

[tool.mypy]
python_version = "3.10"
strict = true
# tensorrt / cuda-python / torch are optional extras that are simply absent in CI.
ignore_missing_imports = true
exclude = '((^|/)(\.venv|build|dist|references|3rdparty)/|_pb2(_grpc)?\.pyi?$)'
# Do NOT set `files = [...]` — run mypy on changed paths (touch-it-fix-it).

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Tests — two tiers. The default run needs no GPU; `gpu` is opt-in.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
# The benchmark harness ships its own offline tests: the arithmetic that turns a buffer
# log into a speed-up is the most consequential code in the repository and needs no
# hardware to verify. Running it on real GPUs without testing it first would only make a
# wrong number more convincing.
testpaths = ["tests", "benchmarks/tests"]
# `-m "not gpu"`: a plain `pytest` must pass on a machine with zero NVIDIA devices, so the
# scheduler's invariants stay verifiable anywhere. `pytest -m gpu` opts into real hardware.
# `not gpu and not multigpu`, not just `not gpu`: `multigpu` is its own marker and some
# tests carry only that one, so `-m "not gpu"` left them selected. A bare `pytest` on a
# laptop then hit the container gate and aborted the whole session — breaking the exact
# promise this line exists to keep, and leaving it kept only by scripts/run_tests.sh.
addopts = "-ra --strict-markers --strict-config -m 'not gpu and not multigpu'"
asyncio_mode = "auto"
timeout = 120
markers = [
    "gpu: needs a real NVIDIA device (and often TensorRT). Excluded from the default run; run with `pytest -m gpu`.",
    "multigpu: needs at least 2 visible NVIDIA devices — the load-balancing evidence.",
    "slow: takes more than ~2s.",
    "bench: a throughput/latency measurement, not a pass/fail assertion.",
]
# Later filters win, so the ignore must follow the error. protobuf 5.29 emits nothing on
# import today; the line is here because a generated module is not ours to fix, and a
# DeprecationWarning from a future protoc would otherwise fail the whole offline tier.
filterwarnings = [
    "error::DeprecationWarning:shipinfer.*",
    "ignore::DeprecationWarning:shipinfer.launch.proto.*",
]

[tool.coverage.run]
branch = true
source = ["src/shipinfer"]
omit = ["*/backends/tensorrt.py", "*/backends/torch_backend.py", "*/backends/onnx.py"]
