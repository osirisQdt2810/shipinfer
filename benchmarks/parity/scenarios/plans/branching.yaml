# Every verb the format has, on one chain: a label table with the demo detector's own ids
# (a ship is 8, not 1), a declared crop that overrides the model's, geometry resolved FROM
# the model, `classes:` row selection, `per:`, `scope:`, and a fan-in.
name: branching
elements:
  decode: {impl: replay}
  detect:
    impl: pool
    model: ship_detector
    params:
      decode: {class_labels: {0: person, 8: ship}, score_threshold: 0.3, max_detections: 120}
  # A frame-level guard: `meta['fps']` is the only frame-level key anything files
  # (`runners/frames.py`), and `when: class == ...` on a row-selecting slot is refused.
  segment:
    impl: pool
    model: ship_segmenter
    when: fps == 20
    params: {classes: [ship], crop: {size: [512, 512]}}
  embed_ship: {impl: pool, model: ship_embedder, params: {classes: [ship]}, after: segment}
  embed_person: {impl: pool, model: person_embedder, params: {classes: [person]}, after: detect}
  # The tracker's own two, carried for the reason the gate's are: this plane read neither,
  # so one chain ran two different trackers. `regression_reset: 0` is the interesting value --
  # it refuses every stream restart, which no default can express.
  track:
    impl: shipvision
    per: camera
    after: [embed_ship, embed_person]
    params: {regression_reset: 0, options: {max_age: 90, track_threshold: 0.4}}
  mtmc:
    impl: shipvision
    scope: global
    # The gate the chain sets, which is the whole point of carrying these two across:
    # the reference's production floor (3 hits, 1/9 of frame height) admits nothing on
    # footage whose subjects are small in frame.
    params:
      options: {min_hits: 1, min_height_fraction: 0.02}
  output: {impl: jsonlines}
