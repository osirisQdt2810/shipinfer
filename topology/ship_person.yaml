# topology/ship_person.yaml -- the production chain
#
# The chain of arch.md §1, with the rejoin spelled out. This file is the design's own
# example, kept here as the thing the loader must accept rather than as a copy that drifts
# from it -- so where the design's snippet is ambiguous, this file is the answer and arch.md
# points at it.
#
# HOW THE ORDER IS DECIDED. An element with no `after:` follows the element declared
# immediately before it. `after:` overrides that, and is how the two branches below split
# and rejoin. Reordering two lines here reorders the chain, so check the resolved wiring
# with `Topology.describe()` after an edit.
#
# WHY `embed_person` AND `track` CARRY AN `after:`. arch.md §1's snippet stops after four
# lines and under-specifies the rejoin; the default rule alone would wire this chain wrong
# and the loader would refuse it, correctly:
#   * `embed_person` needs `after: detect`, not the `embed_ship` declared before it -- a
#     person embedding is computed from the detector's crop, and the ship segmenter and ship
#     embedder are not in its path;
#   * `track` needs BOTH branches as predecessors. With the default rule it would follow
#     only `recognize`, leaving `embed_person` with no successor -- a branch whose vectors
#     nothing consumes, which is `ChainStructureError: ['embed_person'] reach no output`.
# `tests/topology/test_chain.py` loads exactly this wiring with only the phase-D decoder
# substituted, so the file and the tests cannot drift apart again.
#
# HOW A CONDITION IS SCOPED, AND WHY THIS FILE USES `classes:` INSTEAD. A `when:` guards
# exactly ONE element -- the one it is written on. A rejected item is not dropped and the
# walk does not stop: it is handed unchanged to that element's successors
# (`ElementNode.admits`, "skip and continue"). So a condition does NOT extend down a branch,
# and every element on a class-specific branch has to state its own selection -- which is why
# `embed_ship` and `recognize` each carry `params: {classes: [ship]}` below. Without that,
# a person detection would be skipped past `segment` and then run through the ship embedder
# and the ship recogniser: ~15 000 crops/s of wasted GPU at the sizing in CLAUDE.md and,
# worse, a ship identity emitted for a person.
#
# The selection is `classes:` and not `when:` because these elements select detection ROWS
# while `when:` asks a question about the whole FRAME, which holds ships and people at once
# (ADR-017, amended). `Topology.from_spec` refuses `when: class == ...` on a row-selecting
# element and names `params: {classes: [...]}` as the fix.
#
# ...AND WHY THOSE FOUR GUARDS ARE NOT HOW THIS FILE WILL SPELL IT. A `when:` reads
# `item.meta` and an item is a FRAME, so `class == ship` asks a frame to have one class --
# and a frame holds ships and people at once. Nothing writes a frame-level `meta["class"]`,
# so as written these four conditions are false on every frame, and even if something wrote
# one, a frame containing a single person would still run the entire ship branch. Selecting
# ROWS is `params: {classes: [ship]}`, which is what the `pool` crop elements actually read
# (`topology/elements/pool.py`), and `Topology.from_spec` refuses `when: class == ...` on a
# slot that selects rows -- naming `classes:` as the fix. The four guards are now converted;
# `segment` selects no rows and carries no guard either, because a frame-level `when:` has to
# name a fact something files and no element files one today (`docs/arch.md` §1).
# `recognize:` is `impl: shipvision`: identity is a gallery query, and `impl: pool` would file
# the model's raw response under a key `output` reads per detection row -- also a refusal.
#
# WHAT DOES NOT LOAD YET, and it is now exactly one name: `decode: gstreamer-gpu`, which
# lands in phase D (DataPool: NV12 decoded straight into VRAM). `Topology.from_spec` refuses
# this file with UnknownElementImplError naming that decoder, and a test asserts exactly
# that. Every other `impl:` here is REGISTERED today -- `pool` (detect/segment/embed),
# `shipvision` (recognize/track/mtmc) and `kafka` (lazily, `topology/elements/output.py`) --
# which `TestTheProductionChainFile.substituted()` demonstrates: it stands in for the decode
# alone and the rest of the chain builds. Registered is not the same as proven end to end,
# and this file has no run behind it yet; `topology/ship_person_cpu.yaml` is the sibling that
# does (`tests/system/test_real_chain.py`, on real footage and a real engine).
elements:
  decode:       {impl: gstreamer-gpu}               # NV12 -> VRAM, the default
  detect:       {impl: pool, model: ship_detector}
  segment:      {impl: pool, model: ship_segmenter}
  embed_ship:   {impl: pool, model: ship_embedder,   params: {classes: [ship]},   after: segment}
  embed_person: {impl: pool, model: person_embedder, params: {classes: [person]}, after: detect}
  recognize:    {impl: shipvision, params: {classes: [ship]}, after: embed_ship}
  track:        {impl: shipvision, per: camera, after: [recognize, embed_person]}
  mtmc:         {impl: shipvision, scope: global}
  output:       {impl: kafka}
