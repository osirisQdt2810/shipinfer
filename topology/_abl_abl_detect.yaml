# ABLATION CHAIN, not a deployment: detect alone
#
# One of four variants that price the stages of `ship_person_cpu.yaml` by running
# subsets of it at one load. Nothing runs these but the measurement.
name: abl_detect
elements:
  decode:
    impl: replay

  # The one element that letterboxes a whole frame, so it is the one that has to undo exactly
  # that transform. `decode:` here is the *output* decode -- how the engine's rows become
  # source-pixel boxes -- and has nothing to do with the video decoder above it.
  detect:
    impl: pool
    model: ship_detector
    params:
      decode:
        # 0.25 < the tracker's track_threshold (shipvision ByteTrack: 0.5) ON PURPOSE:
        # detections in [0.25, 0.5) are published in events (track_id: null) and used by
        # ByteTrack only to CONTINUE tracks, never to start one. V148's first real run
        # surfaced exactly this: a 0.47 person in every event, tracked by nothing — correct.
        class_labels: {0: person, 8: ship}
        score_threshold: 0.25
        max_detections: 300

  # Whole-frame on the PYTHON plane today: a YOLO-seg engine emits detection rows and a bank
  # of mask prototypes, and the fold that turns those into one area per object is not a
  # per-row scatter-back (P6-SEGMENT-CROP). It declares `classes: [ship]` anyway, and that is
  # not premature: the C++ plane DOES crop per row, so a resolved plan without this line says
  # "every row" there -- the ship segmenter on every person crop at 640x640, and a
  # `mask_area_px` filed on every person record.
  output:
    impl: jsonlines
    params:
      path: var/events.jsonl
      flush_every: 64
