# CI on main for a __MODULE_NAME__ module repository.
#
# Generated from scripts/templates/module-repo/ in the shipinfer parent repo. Edit it
# THERE and re-run `python scripts/sync_module_repos.py`, or five repositories drift apart
# one hand-edit at a time.

name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the CUDA toolkit
        # Only for a repository that has a CMakeLists.txt at its root, i.e. one that ships
        # kernels. `hashFiles` returning empty is the cheapest way to ask "is this the
        # native repo?" without giving that repo a second, drifting copy of this workflow.
        if: hashFiles('CMakeLists.txt') != ''
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: "12.6.0"
          method: network
          sub-packages: '["nvcc", "cudart"]'
      - run: bash scripts/ci_setup.sh
      - run: bash scripts/run_tests.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the CUDA toolkit
        # Only for a repository that has a CMakeLists.txt at its root, i.e. one that ships
        # kernels. `hashFiles` returning empty is the cheapest way to ask "is this the
        # native repo?" without giving that repo a second, drifting copy of this workflow.
        if: hashFiles('CMakeLists.txt') != ''
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: "12.6.0"
          method: network
          sub-packages: '["nvcc", "cudart"]'
      - run: bash scripts/ci_setup.sh
      - run: |
          ruff check src tests
          black --check src tests
          isort --check-only src tests
